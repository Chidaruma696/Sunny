[project]
name = "sunny"
dynamic = ["version"]
description = "Conditional formatting for Excel, described in plain words"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Chidaruma" }]
dependencies = [
    "PySide6-Essentials>=6.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10", "pillow"]

[project.scripts]
sunny = "sunny.cli:main"

[project.gui-scripts]
sunny-gui = "sunny.cli:main"

[project.urls]
Homepage = "https://github.com/Chidaruma696/Sunny"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "sunny.__version__" }

[tool.setuptools.packages.find]
include = ["sunny*"]

[tool.setuptools.package-data]
sunny = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
